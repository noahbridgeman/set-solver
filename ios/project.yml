# Xcode-Projekt der iPhone-App. Neu erzeugen nach Änderungen hier:  cd ios && xcodegen
# App-Symbol: scripts/make_app_icon.py. Apple-Team: ios/Local.xcconfig (siehe Signing.xcconfig).
# (SetSolver.xcodeproj ist eingecheckt, damit man es auch ohne XcodeGen direkt öffnen kann.)
name: SetSolver
options:
  bundleIdPrefix: io.github.noahbridgeman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SetCore:
    path: SetCore
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  SetSolver:
    type: application
    platform: iOS
    sources:
      - path: SetSolver
      - path: Models/SetDetector.mlpackage
      - path: Models/SetClassifier.mlpackage
    dependencies:
      - package: SetCore
        product: SetCore
    info:
      path: SetSolver/Info.plist
      properties:
        CFBundleDisplayName: SET
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: Die Kamera erkennt die SET-Karten auf dem Tisch.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.noahbridgeman.setsolver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
